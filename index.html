        // ── 2. 從 DOM 收集所有 <img> src ─────────────────────────────────
        function collectDomImages() {
          var urls = [];

          // <img src>
          document.querySelectorAll("img[src]").forEach(function (img) {
            var src = img.getAttribute("src");
            if (src) urls.push(src);
          });

          // CSS background-image
          document.querySelectorAll("*").forEach(function (el) {
            var bg = window.getComputedStyle(el).backgroundImage;
            if (bg && bg !== "none") {
              var match = bg.match(/url\(["']?(.*?)["']?\)/);
              if (match && match[1]) {
                urls.push(match[1]);
              }
            }
          });

          return urls;
        }

        // ── 3. 合併去重 ───────────────────────────────────────────────────
        function mergeUnique(a, b) {
          var set = {};
          var result = [];
          a.concat(b).forEach(function (src) {
            // 統一為絕對路徑後去重
            var key = src;
            if (!set[key]) {
              set[key] = true;
              result.push(src);
            }
          });
          return result;
        }

        // ── 4. 更新進度 UI ────────────────────────────────────────────────
        function updateProgress(loaded, total) {
          var pct = total === 0 ? 100 : Math.round((loaded / total) * 100);

          // 1. 更新文字百分比
          const percentText = document.getElementById("loading-percent");
          if (percentText) {
            percentText.textContent = pct + "%";
          }

          // 2. 更新牛奶高度 (由下往上)
          const milkWrap = document.getElementById("loading-milk-wrap");
          if (milkWrap) {
            milkWrap.style.height = pct + "%";
          }
        }

        // ── 5. 隱藏 loading ───────────────────────────────────────────────
        function hideLoading() {
          var screen = document.getElementById("loading-screen");
          document.body.classList.remove("loading-active");
          document.body.classList.add("loading-done");
          screen.classList.add("fade-out");
          setTimeout(function () {
            screen.style.display = "none";
          }, 900);
        }

        function preloadImage(src) {
          return new Promise(function (resolve) {
            var img = new Image();

            img.onload = function () {
              if (img.decode) {
                img
                  .decode()
                  .catch(function () {})
                  .finally(resolve);
              } else {
                resolve();
              }
            };

            img.onerror = function () {
              resolve(); // 就算錯誤也繼續
            };

            img.src = src;
          });
        }

        // ── 6. 主流程 ─────────────────────────────────────────────────────
        function startPreload() {
          var domSrcs = collectDomImages();
          var allSrcs = mergeUnique(domSrcs, DYNAMIC_IMAGES);
          var total = allSrcs.length;
          var loaded = 0;

          // 沒有圖就直接結束
          if (total === 0) {
            hideLoading();
            return;
          }
          updateProgress(0, total);

          // var forceFinishTimer = setTimeout(function () {
          //   console.warn("⚠ 預載超時，強制進入頁面");
          //   hideLoading();
          // }, 120000000);

          allSrcs.forEach(function (src) {
            preloadImage(src).then(function () {
              loaded++;
              updateProgress(loaded, total);

              if (loaded >= total) {
                // clearTimeout(forceFinishTimer);
                setTimeout(hideLoading, 1500);
              }
            });
          });
        }

        // DOM 已解析後立即開始
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", startPreload);
        } else {
          startPreload();
        }
      })();
